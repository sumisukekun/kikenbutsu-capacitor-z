<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>危険物取扱者【乙種4類】予想問題演習帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#153259;
    --paper:#C3DEF8;
    --paper-raised:#EBF5FE;
    --seal:#B23A2E;
    --seal-soft:#E9D6D1;
    --gold:#A6873A;
    --pass:#2E6F4E;
    --pass-soft:#DCE9DF;
    --slate:#3E5C81;
    --line:#AECBEA;
    --line-strong:#7CA6D4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New',sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(20,70,130,0.06) 1px, transparent 0);
    background-size: 18px 18px;
  }
  #app{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:176px;
    position:relative;
  }
  .topbar{
    padding:calc(22px + env(safe-area-inset-top)) 20px 14px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    position:sticky; top:0; z-index:5;
  }
  .topbar.with-back{
    display:flex; align-items:center; gap:12px;
  }
  .back-btn{
    flex-shrink:0;
    border:1px solid var(--line-strong);
    background:var(--paper-raised);
    color:var(--ink);
    border-radius:4px;
    padding:7px 12px;
    font-size:13px;
    font-family:'Zen Kaku Gothic New',sans-serif;
    cursor:pointer;
  }
  .brand{
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:.02em;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:2px;
  }
  .brand small{
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-weight:500;
    font-size:12px;
    color:var(--slate);
    letter-spacing:.08em;
  }
  .main{flex:1; padding:18px 20px 10px;}
  h2.section-title{
    font-family:'Shippori Mincho',serif;
    font-size:17px;
    font-weight:700;
    margin:0 0 14px;
    padding-bottom:8px;
    border-bottom:2px solid var(--ink);
    display:inline-block;
  }

  /* ---------- HOME ---------- */
  .home-hero{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:4px;
    padding:20px;
    margin-bottom:20px;
    position:relative;
    overflow:hidden;
  }
  .home-hero::before{
    content:"";
    position:absolute; top:0; left:0; width:6px; height:100%;
    background:var(--seal);
  }
  .home-hero .lead{font-size:13.5px;color:var(--slate);line-height:1.7;margin:0 0 12px;}
  .stat-row{display:flex; gap:10px; flex-wrap:wrap;}
  .stat-chip{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:3px;
    padding:8px 12px;
    min-width:88px;
  }
  .stat-chip .num{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:19px; color:var(--ink);}
  .stat-chip .lbl{font-size:10.5px; color:var(--slate); margin-top:2px;}

  .field-group{margin-bottom:16px;}
  .field-label{
    font-size:12px; font-weight:700; color:var(--slate);
    margin-bottom:8px; letter-spacing:.05em;
    display:flex; align-items:center; gap:6px;
  }
  .field-label .idx{
    font-family:'JetBrains Mono',monospace;
    background:var(--ink); color:var(--paper);
    font-size:10px; padding:1px 6px; border-radius:2px;
  }
  .chip-set{display:flex; flex-wrap:wrap; gap:8px;}
  .chip-btn{
    border:1px solid var(--line-strong);
    background:var(--paper-raised);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:13px;
    padding:8px 13px;
    border-radius:3px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .chip-btn:hover{border-color:var(--ink);}
  .chip-btn.active{
    background:var(--ink); color:var(--paper-raised); border-color:var(--ink);
  }
  .start-btn{
    width:100%;
    margin-top:6px;
    background:var(--seal);
    color:#fff;
    border:none;
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:.08em;
    padding:15px;
    border-radius:3px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    box-shadow:0 2px 0 #7d281f;
  }
  .start-btn:active{transform:translateY(2px); box-shadow:0 0 0 #7d281f;}
  .start-btn:disabled{background:#B7C9DE; box-shadow:none; cursor:not-allowed;}
  .empty-note{font-size:12.5px; color:var(--seal); margin-top:8px;}

  /* ---------- DASHBOARD ---------- */
  .dash-block{margin-bottom:22px;}
  .dash-subtitle{
    font-size:11.5px; font-weight:700; color:var(--slate); letter-spacing:.08em; margin:0 0 10px;
  }
  .dash-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .dash-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:4px;
    padding:12px 8px; text-align:center;
  }
  .dash-card .num{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:18px; color:var(--ink);}
  .dash-card .num small{font-size:11px; font-weight:500; color:var(--slate);}
  .dash-card .lbl{font-size:9.5px; color:var(--slate); margin-top:3px; line-height:1.4;}

  .today-row{display:flex; align-items:center; gap:18px; background:var(--paper-raised); border:1px solid var(--line); border-radius:4px; padding:16px;}
  .ring-num{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; fill:var(--ink);}
  .today-copy{flex:1;}
  .today-copy .t-num{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:22px; color:var(--ink);}
  .today-copy .t-lbl{font-size:11.5px; color:var(--slate); margin-top:2px;}

  .progress-mini-wrap{background:var(--paper-raised); border:1px solid var(--line); border-radius:4px; padding:16px;}
  .progress-mini-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .progress-mini-head .p-num{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; color:var(--ink);}
  .progress-mini-head .p-lbl{font-size:11.5px; color:var(--slate);}
  .progress-mini-track{height:8px; background:var(--line); border-radius:4px; overflow:hidden;}
  .progress-mini-fill{height:100%; background:var(--pass); border-radius:4px; transition:width .3s ease;}

  .subject-bars{background:var(--paper-raised); border:1px solid var(--line); border-radius:4px; padding:16px;}
  .subj-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .subj-row:last-child{margin-bottom:0;}
  .subj-name{width:84px; flex:none; font-size:11.5px; color:var(--ink); font-weight:700;}
  .subj-track{flex:1; height:9px; background:var(--line); border-radius:5px; overflow:hidden;}
  .subj-fill{height:100%; background:var(--gold); border-radius:5px; transition:width .3s ease;}
  .subj-pct{width:56px; flex:none; text-align:right; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--slate);}

  .review-card{
    background:var(--paper-raised); border:1px solid var(--seal); border-radius:4px;
    padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .review-card .r-copy b{font-family:'Shippori Mincho',serif; font-size:15px; display:block; color:var(--seal); margin-bottom:2px;}
  .review-card .r-copy span{font-size:12px; color:var(--slate);}
  .review-card button{
    flex:none; background:var(--seal); color:#fff; border:none;
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:13px;
    padding:11px 16px; border-radius:3px; cursor:pointer;
  }
  .review-card button:disabled{background:#C0D2E6; cursor:not-allowed;}

  /* ---------- QUIZ ---------- */
  .progress-bar{
    display:flex; align-items:center; gap:10px; margin-bottom:16px;
  }
  .progress-track{flex:1; height:4px; background:var(--line); border-radius:2px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--seal); transition:width .25s ease;}
  .progress-txt{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--slate); white-space:nowrap;}

  .tag-row{display:flex; gap:8px; margin-bottom:14px;}
  .tag{
    font-size:11px; padding:4px 10px; border-radius:2px;
    border:1px solid var(--line-strong); color:var(--slate);
    font-weight:500;
  }
  .tag.year{color:var(--gold); border-color:var(--gold);}
  .tag.subject{color:var(--ink); border-color:var(--ink); font-weight:700;}
  .tag.review{color:#fff; background:var(--seal); border-color:var(--seal); font-weight:700;}

  .q-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:4px;
    padding:22px 20px;
    margin-bottom:16px;
  }
  .q-text{
    font-size:15.5px; line-height:1.85; font-weight:500;
    margin:0;
  }
  .choice-list{display:flex; flex-direction:column; gap:10px;}
  .choice-btn{
    display:flex; align-items:flex-start; gap:12px;
    text-align:left;
    background:var(--paper-raised);
    border:1.5px solid var(--line-strong);
    border-radius:4px;
    padding:13px 14px;
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:14px;
    line-height:1.6;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
  }
  .choice-btn:hover{border-color:var(--ink);}
  .choice-btn.selected{border-color:var(--seal); background:#FBF1EE;}
  .choice-num{
    flex:none;
    width:24px; height:24px; border-radius:50%;
    border:1.5px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px;
    color:var(--slate);
  }
  .choice-btn.selected .choice-num{border-color:var(--seal); color:var(--seal); background:#fff;}

  .choice-btn.correct{border-color:var(--pass); background:var(--pass-soft);}
  .choice-btn.correct .choice-num{border-color:var(--pass); color:#fff; background:var(--pass);}
  .choice-btn.wrong{border-color:var(--seal); background:#FBF1EE;}
  .choice-btn.wrong .choice-num{border-color:var(--seal); color:#fff; background:var(--seal);}
  .choice-btn.disabled{cursor:default;}
  .choice-btn mark.wrong-part{
    background:var(--seal-soft); color:var(--seal);
    font-weight:700; border-radius:2px; padding:0 2px;
  }

  .submit-btn{
    width:100%; margin-top:18px;
    background:var(--ink); color:var(--paper-raised);
    border:none; font-family:'Shippori Mincho',serif; font-weight:700;
    font-size:15px; letter-spacing:.05em; padding:14px; border-radius:3px;
    cursor:pointer;
  }
  .submit-btn:disabled{background:#C0D2E6; color:#6F87A6; cursor:not-allowed;}

  /* ---------- RESULT ---------- */
  .stamp-wrap{
    display:flex; justify-content:center; margin:6px 0 18px;
  }
  .stamp{
    width:88px; height:88px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Shippori Mincho',serif;
    font-size:46px; font-weight:700;
    border:5px solid currentColor;
    animation: stampIn .38s cubic-bezier(.2,1.4,.4,1);
    transform:rotate(-8deg);
  }
  .stamp.ok{color:var(--seal);}
  .stamp.ng{color:var(--slate);}
  @keyframes stampIn{
    0%{transform:scale(2.2) rotate(-8deg); opacity:0;}
    60%{transform:scale(.92) rotate(-8deg); opacity:1;}
    100%{transform:scale(1) rotate(-8deg); opacity:1;}
  }
  .result-headline{
    text-align:center;
    font-family:'Shippori Mincho',serif;
    font-weight:700; font-size:15px;
    margin:-6px 0 18px;
    color:var(--slate);
  }
  .explain-panel{
    background:var(--paper-raised);
    border-left:4px solid var(--gold);
    border-radius:0 4px 4px 0;
    padding:16px 18px;
    margin-top:6px;
  }
  .explain-panel .heading{
    font-size:11.5px; font-weight:700; color:var(--gold);
    letter-spacing:.1em; margin-bottom:8px;
  }
  .explain-panel p{font-size:13.5px; line-height:1.85; margin:0; color:var(--ink);}
  .note-panel{
    background:var(--seal-soft);
    border-left:4px solid var(--seal);
    border-radius:0 4px 4px 0;
    padding:16px 18px;
    margin-top:12px;
  }
  .note-panel .heading{
    font-size:11.5px; font-weight:700; color:var(--seal);
    letter-spacing:.1em; margin-bottom:8px;
  }
  .note-panel p{font-size:13px; line-height:1.85; margin:0; color:var(--ink);}
  .next-btn{
    width:100%; margin-top:18px;
    background:var(--seal); color:#fff;
    border:none; font-family:'Shippori Mincho',serif; font-weight:700;
    font-size:15px; padding:14px; border-radius:3px; cursor:pointer;
    box-shadow:0 2px 0 #7d281f;
  }
  .next-btn:active{transform:translateY(2px); box-shadow:0 0 0 #7d281f;}

  /* ---------- SUMMARY ---------- */
  .summary-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:4px;
    padding:28px 20px; text-align:center;
  }
  .summary-card .rate{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:44px; color:var(--ink);
  }
  .summary-card .rate span{font-size:20px; color:var(--slate);}
  .summary-card .caption{font-size:13px; color:var(--slate); margin:6px 0 20px;}
  .summary-actions{display:flex; gap:10px;}
  .summary-actions button{
    flex:1; padding:13px; border-radius:3px; font-family:'Zen Kaku Gothic New',sans-serif;
    font-weight:700; font-size:13.5px; cursor:pointer; border:1.5px solid var(--ink);
  }
  .summary-actions .primary{background:var(--ink); color:var(--paper-raised);}
  .summary-actions .secondary{background:transparent; color:var(--ink);}
  .share-btn{
    width:100%; margin-top:10px; padding:12px; border-radius:3px;
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:13px;
    cursor:pointer; border:1.5px dashed var(--slate); background:transparent; color:var(--slate);
  }
  .share-btn:active{opacity:.7;}

  /* ---------- CALENDAR ---------- */
  .cal-overview{
    display:flex; gap:10px; margin-bottom:18px;
  }
  .cal-stat{
    flex:1; background:var(--paper-raised); border:1px solid var(--line);
    border-radius:4px; padding:12px 10px; text-align:center;
  }
  .cal-stat .num{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:20px;}
  .cal-stat .lbl{font-size:10px; color:var(--slate); margin-top:3px;}
  .cal-nav{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;
  }
  .cal-nav .month-label{font-family:'Shippori Mincho',serif; font-weight:700; font-size:16px;}
  .cal-nav button{
    background:none; border:1px solid var(--line-strong); border-radius:3px;
    width:32px; height:32px; cursor:pointer; font-size:15px; color:var(--ink);
  }
  .cal-grid{
    display:grid; grid-template-columns:repeat(7,1fr); gap:5px;
  }
  .cal-dow{text-align:center; font-size:10.5px; color:var(--slate); font-weight:700; padding-bottom:4px;}
  .cal-cell{
    aspect-ratio:1; border-radius:3px; position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;
  }
  .cal-cell.empty{border:none;}
  .cal-cell .d{font-size:11px; color:var(--slate);}
  .cal-cell .frac{font-size:8.5px; color:var(--ink); font-weight:700; margin-top:1px;}
  .cal-cell.today{outline:2px solid var(--seal); outline-offset:1px;}
  .cal-legend{display:flex; align-items:center; gap:6px; margin-top:14px; font-size:11px; color:var(--slate);}
  .cal-legend .sw{width:13px; height:13px; border-radius:2px; border:1px solid var(--line);}
  .cal-caption{font-size:11px; color:var(--slate); margin:0 0 8px;}

  /* ---------- NAV ---------- */
  .bottom-nav{
    position:fixed; bottom:92px; left:50%; transform:translateX(-50%);
    width:100%; max-width:640px;
    background:var(--paper-raised); border-top:1px solid var(--line);
    display:flex;
    z-index:10;
  }
  .nav-btn{
    flex:1; border:none; background:none; padding:12px 0 10px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    cursor:pointer; color:var(--slate); font-family:'Zen Kaku Gothic New',sans-serif; font-size:11px;
  }
  .nav-btn.active{color:var(--seal);}
  .nav-btn svg{width:20px; height:20px;}

  .empty-state{
    text-align:center; padding:40px 10px; color:var(--slate); font-size:13px; line-height:1.8;
  }
  ::selection{background:var(--seal-soft);}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===========================================================
   window.storage 互換シム（Capacitorアプリ用）
   -----------------------------------------------------------
   このアプリは元々Claudeのアーティファクト環境が提供する
   window.storage というAPIを使っています。
   実機・シミュレータのWebViewにはこのAPIが無いため、
   同じ入出力になるようlocalStorageで再現しています。
   アプリ本体（下のメインscript）は一切変更していません。
   =========================================================== */
if(!window.storage){
  window.storage = {
    async get(key, shared){
      const raw = window.localStorage.getItem(key);
      if(raw===null) return null;
      return {key, value: raw, shared: !!shared};
    },
    async set(key, value, shared){
      window.localStorage.setItem(key, value);
      return {key, value, shared: !!shared};
    },
    async delete(key, shared){
      window.localStorage.removeItem(key);
      return {key, deleted:true, shared: !!shared};
    },
    async list(prefix, shared){
      const keys = [];
      for(let i=0;i<window.localStorage.length;i++){
        const k = window.localStorage.key(i);
        if(!prefix || (k && k.startsWith(prefix))) keys.push(k);
      }
      return {keys, prefix, shared: !!shared};
    }
  };
}
</script>
<script>
/* ===========================================================
   AdMob バナー広告（Capacitorアプリでのみ動作）
   -----------------------------------------------------------
   ブラウザでこのファイルを直接開いた場合や、Capacitorでラップ
   する前の状態では window.Capacitor が存在しないため、
   下記コードは何もせずスキップされます（プレビューには影響なし）。
   本番公開前に、TEST_APP_ID / TEST_BANNER_ID を
   AdMobで発行された自分の本番IDに置き換えてください。
   =========================================================== */
(function(){
  // ↓↓↓ ここを自分のAdMob本番IDに置き換える（Android/iOSそれぞれ別のIDです）↓↓↓
  // ※このアプリはまだAdMob広告ユニットを作成していないため、プレースホルダーのままです。
  const PROD_BANNER_ID_ANDROID = 'ca-app-pub-XXXXXXXXXXXXXXXX/XXXXXXXXXX';
  const PROD_BANNER_ID_IOS = 'ca-app-pub-XXXXXXXXXXXXXXXX/XXXXXXXXXX';
  // Googleが公式に配布しているテスト用ID（動作確認中はこちらを使う）
  const TEST_BANNER_ID_ANDROID = 'ca-app-pub-3940256099942544/6300978111';
  const TEST_BANNER_ID_IOS = 'ca-app-pub-3940256099942544/2934735716';

  // 実行中のプラットフォームに応じて、Android用/iOS用のIDを切り替える
  const platform = (window.Capacitor && window.Capacitor.getPlatform) ? window.Capacitor.getPlatform() : 'web';
  const PROD_BANNER_ID = platform === 'ios' ? PROD_BANNER_ID_IOS : PROD_BANNER_ID_ANDROID;
  const TEST_BANNER_ID = platform === 'ios' ? TEST_BANNER_ID_IOS : TEST_BANNER_ID_ANDROID;

  // ★重要：クローズドテスト中はtrueのままにしてください。
  // 自動テストツールや外部のテスターが本番広告を誤ってクリックすると、
  // 「無効なクリック」とみなされAdMobアカウントが停止（BAN）されるリスクがあります。
  // クローズドテストが完了し、製品版（本番）申請のビルドを作る直前に
  // AdMobで本番の広告ユニットIDを取得し、上のPROD_BANNER_ID_*に設定してから
  // false へ戻して再ビルド・再アップロードしてください。
  const FORCE_TEST_ADS_FOR_CLOSED_TESTING = true;

  // 本番IDをまだ設定していない間、またはクローズドテスト中は自動でテストIDを使う（誤クリックによる規約違反防止）
  const BANNER_ID = (FORCE_TEST_ADS_FOR_CLOSED_TESTING || PROD_BANNER_ID.includes('XXXX')) ? TEST_BANNER_ID : PROD_BANNER_ID;

  async function initAds(){
    if(!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) return;
    const { AdMob } = window.Capacitor.Plugins || {};
    if(!AdMob) return;

    try{
      await AdMob.initialize({
        testingDevices: [],       // 実機でテストする場合はデバイスIDをここに追加
        initializeForTesting: BANNER_ID===TEST_BANNER_ID,
      });
    }catch(e){
      console.error('AdMob initialize failed', e);
      return; // initializeに失敗した場合のみ広告表示を諦める
    }

    // App Tracking Transparency（ATT）許可リクエスト（iOS 14+）
    // App Store審査ガイドライン2.1対応：実際に広告(トラッキングを伴うデータ収集)を
    // リクエストするshowBanner()より前に許可ダイアログを表示する必要がある。
    // 公式ドキュメントの推奨順序に合わせ、AdMob.initialize()の直後・showBanner()より前に呼び出す
    // （initialize()より前に呼ぶとプラグイン側で正しく機能しないことが判明したため修正）。
    // Android等、未実装のプラットフォームでは例外になるだけなので握りつぶして続行する。
    try{
      if(AdMob.trackingAuthorizationStatus){
        const trackingInfo = await AdMob.trackingAuthorizationStatus();
        if(trackingInfo && trackingInfo.status === 'notDetermined'){
          await AdMob.requestTrackingAuthorization();
        }
      }
    }catch(e){
      console.error('ATT request failed (continuing without it)', e);
    }

    // EU/UK等のユーザー向け同意フォーム（Googleの規約で必須）
    // ここが失敗しても（未設定・ネットワーク等）バナー表示自体は止めない
    try{
      const consentInfo = await AdMob.requestConsentInfo();
      if(consentInfo.isConsentFormAvailable && consentInfo.status === 'REQUIRED'){
        await AdMob.showConsentForm();
      }
    }catch(e){
      console.error('AdMob consent flow failed (banner will still attempt to show)', e);
    }

    try{
      await AdMob.showBanner({
        adId: BANNER_ID,
        adSize: 'ADAPTIVE_BANNER',
        position: 'BOTTOM_CENTER',
        margin: 0, // 画面最下部に固定。アプリ側のナビゲーションバー・ボタンは
                   // CSS側(#app padding-bottom / .bottom-nav bottom)で
                   // 広告の高さぶん上に逃がしてあるので、広告は0でOK
      });
    }catch(e){
      console.error('AdMob showBanner failed', e);
    }
  }
  initAds();
})();
</script>
<script>
/* ---------- ストアレビュー依頼（ダウンロード数改善のためのASO施策） ----------
   演習を3回以上終え、かつ正答率70%以上という「良い体験」のタイミングで、
   ストア標準のレビュー依頼ダイアログを一度だけ表示する。
   ネイティブアプリ上でのみ動作し、Web版では何もしない。
   一度依頼したら二度と表示しない（OS側にも表示回数の上限があるため、
   アプリ側でも節度を持って呼び出す）。 */
async function maybeRequestReview(rate){
  try{
    if(!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) return;
    if(window.localStorage.getItem('reviewRequested')) return;

    const count = parseInt(window.localStorage.getItem('completedSessionCount')||'0', 10) + 1;
    window.localStorage.setItem('completedSessionCount', String(count));

    if(count>=3 && rate>=70){
      const { InAppReview } = window.Capacitor.Plugins || {};
      if(!InAppReview) return;
      window.localStorage.setItem('reviewRequested', '1');
      await InAppReview.requestReview();
    }
  }catch(e){
    console.error('InAppReview requestReview failed', e);
  }
}

/* ---------- 演習結果のSNSシェア（口コミ経由の流入を狙うASO施策） ----------
   結果画面の「結果をシェアする」ボタンから呼び出す。
   ネイティブアプリではOS標準の共有シート（X/LINEなど選択可）を、
   Web版ではWeb Share APIまたはXの投稿画面をフォールバックとして開く。 */
async function shareResult(session){
  const rate = Math.round(session.correct/session.questions.length*100);
  const text = `危険物取扱者（乙種4類）の予想問題演習で正答率${rate}%でした！（${session.questions.length}問中${session.correct}問正解）\n「危険物取扱者【乙種4類】予想問題演習帳」で毎日コツコツ復習中です。`;
  const shareUrl = 'https://sumisukekun.github.io/';
  try{
    if(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()){
      const { Share } = window.Capacitor.Plugins || {};
      if(Share){
        await Share.share({ text, url: shareUrl, dialogTitle: '演習結果をシェア' });
        return;
      }
    }
    if(navigator.share){
      await navigator.share({ text, url: shareUrl });
    }else{
      const tweetUrl = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text + '\n' + shareUrl);
      window.open(tweetUrl, '_blank');
    }
  }catch(e){
    // ユーザーが共有シートをキャンセルした場合もここに来るが、異常ではないため何もしない
    console.error('shareResult failed', e);
  }
}
</script>

/* ---------- storage helpers ----------
   すべての学習データを1つのキーにまとめて保存する（保存回数を減らすため）
   dailyStats   : 日付 -> {answered, correct}  … カレンダー用
   perQuestion  : 問題id -> {attempts, correct} … 科目別正答率・苦手問題判定用
   wrongIds     : 直近の解答で間違えたまま復習が済んでいない問題idの配列
   currentStreak/bestStreak : 連続正解記録（現在／自己ベスト）
   lapCount/seenInLap       : 全問を何周したか
---------------------------------------- */
const APP_KEY = 'app-data';
const DAILY_GOAL = 30;
function defaultAppData(){
  return {
    dailyStats:{}, perQuestion:{}, wrongIds:[],
    currentStreak:0, bestStreak:0,
    lapCount:0, seenInLap:[]
  };
}
async function loadAppData(){
  try{
    const r = await window.storage.get(APP_KEY, false);
    if(r && r.value) return Object.assign(defaultAppData(), JSON.parse(r.value));
    return defaultAppData();
  }catch(e){ return defaultAppData(); }
}
async function saveAppData(){
  try{ await window.storage.set(APP_KEY, JSON.stringify(state.data), false); }
  catch(e){ console.error('storage save failed', e); }
}
function todayStr(d){
  d = d || new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dayStreak(dailyStats){
  let streak=0;
  let cursor = new Date();
  while(true){
    const key = todayStr(cursor);
    if(dailyStats[key] && dailyStats[key].answered>0){
      streak++;
      cursor.setDate(cursor.getDate()-1);
    } else break;
  }
  return streak;
}
function subjectStats(perQuestion){
  return SUBJECTS.map(subj=>{
    const qs = QUESTIONS.filter(q=>q.subject===subj);
    let attempts=0, correct=0;
    qs.forEach(q=>{
      const rec = perQuestion[q.id];
      if(rec){ attempts+=rec.attempts; correct+=rec.correct; }
    });
    const rate = attempts? Math.round(correct/attempts*100):0;
    return {subject:subj, attempts, correct, rate};
  });
}

/* ---------- app state ---------- */
const state = {
  view:'home', // home | quiz | result | summary | calendar
  loading:true,
  data:defaultAppData(),
  filterSet:'all',
  filterSubject:'all',
  filterCount:10,
  session:null, // {questions, idx, correct, selected, answered, mode}
  calYear:new Date().getFullYear(),
  calMonth:new Date().getMonth(), // 0-based
};

function filteredQuestions(){
  return QUESTIONS.filter(q=>
    (state.filterSet==='all' || q.set===state.filterSet) &&
    (state.filterSubject==='all' || q.subject===state.filterSubject)
  );
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function startSession(){
  const pool = shuffle(filteredQuestions());
  const n = state.filterCount==='all' ? pool.length : Math.min(state.filterCount, pool.length);
  state.session = { questions: pool.slice(0,n), idx:0, correct:0, selected:null, answered:false, mode:'normal' };
  state.view='quiz';
  render();
}
function startReviewSession(){
  const wrongSet = new Set(state.data.wrongIds);
  const pool = shuffle(QUESTIONS.filter(q=>wrongSet.has(q.id)));
  if(pool.length===0) return;
  state.session = { questions: pool, idx:0, correct:0, selected:null, answered:false, mode:'review' };
  state.view='quiz';
  render();
}
async function submitAnswer(){
  const s = state.session;
  if(s.selected===null || s.answered) return;
  s.answered = true;
  const q = s.questions[s.idx];
  const isCorrect = s.selected===q.answer;
  if(isCorrect) s.correct++;
  const d = state.data;

  // 日別記録
  const key = todayStr();
  if(!d.dailyStats[key]) d.dailyStats[key] = {answered:0, correct:0};
  d.dailyStats[key].answered++;
  if(isCorrect) d.dailyStats[key].correct++;

  // 問題別記録（科目別正答率・苦手問題の判定に使用）
  if(!d.perQuestion[q.id]) d.perQuestion[q.id] = {attempts:0, correct:0};
  d.perQuestion[q.id].attempts++;
  if(isCorrect) d.perQuestion[q.id].correct++;

  // 間違えた問題リストの更新（正解したら復習リストから外れる）
  const wrongSet = new Set(d.wrongIds);
  if(isCorrect) wrongSet.delete(q.id); else wrongSet.add(q.id);
  d.wrongIds = [...wrongSet];

  // 連続正解記録
  if(isCorrect){
    d.currentStreak++;
    if(d.currentStreak > d.bestStreak) d.bestStreak = d.currentStreak;
  } else {
    d.currentStreak = 0;
  }

  // 周回数（全問に1回ずつ触れたら1周とカウント）
  const seenSet = new Set(d.seenInLap);
  seenSet.add(q.id);
  if(seenSet.size >= QUESTIONS.length){
    d.lapCount++;
    seenSet.clear();
  }
  d.seenInLap = [...seenSet];

  await saveAppData();
  state.view='result';
  render();
}
function nextQuestion(){
  const s = state.session;
  if(s.idx+1 < s.questions.length){
    s.idx++; s.selected=null; s.answered=false;
    state.view='quiz';
  }else{
    state.view='summary';
    const rate = Math.round(s.correct/s.questions.length*100);
    maybeRequestReview(rate);
  }
  render();
}

function ringSvg(current, goal){
  const size=84, stroke=9, r=(size-stroke)/2, c=2*Math.PI*r;
  const pct=Math.min(1, goal? current/goal:0);
  const offset = c*(1-pct);
  const color = pct>=1 ? 'var(--pass)' : 'var(--seal)';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none;">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="54%" text-anchor="middle" class="ring-num">${current}/${goal}</text>
  </svg>`;
}

/* ---------- render: result ---------- */
// 選択肢テキストのうち「誤りの原因となっている箇所」を <mark> で強調する。
// q.wrongMarks = { 選択肢index: "強調したい部分文字列" } の形式（任意項目）。
function markWrongPhrase(text, phrase){
  if(!phrase) return text;
  const idx = text.indexOf(phrase);
  if(idx===-1) return text;
  return text.slice(0,idx) + '<mark class="wrong-part">' + phrase + '</mark>' + text.slice(idx+phrase.length);
}

function renderResult(){
  const s = state.session;
  const q = s.questions[s.idx];
  const isCorrect = s.selected===q.answer;
  const choicesHtml = q.choices.map((c,i)=>{
    let cls='choice-btn disabled';
    let label = c;
    if(i===q.answer) cls+=' correct';
    else{
      if(i===s.selected) cls+=' wrong';
      const phrase = q.wrongMarks && q.wrongMarks[i];
      if(phrase) label = markWrongPhrase(c, phrase);
    }
    return `<button class="${cls}" disabled><span class="choice-num">${i+1}</span><span>${label}</span></button>`;
  }).join('');
  const isLast = s.idx+1>=s.questions.length;
  const noteHtml = q.note ? `
  <div class="note-panel">
    <div class="heading">補足</div>
    <p>${q.note}</p>
  </div>` : '';
  return `
  <div class="tag-row">
    <span class="tag year">${q.set} 問${q.qno}</span>
    <span class="tag subject">${q.subject}</span>
  </div>
  <div class="stamp-wrap">
    <div class="stamp ${isCorrect?'ok':'ng'}">${isCorrect?'○':'✕'}</div>
  </div>
  <div class="result-headline">${isCorrect?'正解です':'不正解です — 正解は選択肢'+(q.answer+1)+'番'}</div>
  <div class="q-card"><p class="q-text">${q.text}</p></div>

    <div class="heading">解説</div>

  </div>

  <button class="next-btn" id="nextBtn">${isLast?'結果を見る':'次の問題へ'}</button>
  `;
}

/* ---------- render: calendar ---------- */
function calendarMarkup(){
  const dailyStats = state.data.dailyStats;
  const y=state.calYear, m=state.calMonth;
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const todayKey = todayStr();

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec = dailyStats[key];
    let bg = 'var(--paper-raised)';
    if(rec){
      const a = rec.answered;
      if(a>=15) bg='#6FA3DE';
      else if(a>=8) bg='#A9CBEF';
      else if(a>=1) bg='#D7E8FB';
    }
    const isToday = key===todayKey;
    cells += `<div class="cal-cell ${isToday?'today':''}" style="background:${bg}">
      <div class="d">${d}</div>
      ${rec? `<div class="frac">${rec.correct}/${rec.answered}問</div>`:''}
    </div>`;
  }

  const dowLabels = ['日','月','火','水','木','金','土'].map(d=>`<div class="cal-dow">${d}</div>`).join('');

  return `
  <p class="cal-caption">各日付の表示：正解数 / 解答数</p>
  <div class="cal-nav">
    <button id="calPrev">‹</button>
    <div class="month-label">${y}年 ${m+1}月</div>
    <button id="calNext">›</button>
  </div>
  <div class="cal-grid">${dowLabels}${cells}</div>
  <div class="cal-legend">
    <span class="sw" style="background:var(--paper-raised)"></span>未学習
    <span class="sw" style="background:#D7E8FB"></span>1〜7問
    <span class="sw" style="background:#A9CBEF"></span>8〜14問
    <span class="sw" style="background:#6FA3DE"></span>15問以上
  </div>
  `;
}

function renderCalendar(){

    <div class="bottom-nav">
      <button class="nav-btn ${navHome?'active':''}" data-nav="home">${ICON_QUIZ}問題を解く</button>
      <button class="nav-btn ${state.view==='calendar'?'active':''}" data-nav="calendar">${ICON_CAL}学習記録</button>
    </div>
  `;
  attachEvents();
}

function attachEvents(){
  const app = document.getElementById('app');
  app.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.onclick = ()=>{
      const nav = btn.getAttribute('data-nav');
      if(nav==='home') state.view='home';
      else state.view='calendar';
      render();
    };
  });
  app.querySelectorAll('[data-act="setSet"]').forEach(btn=>{
    btn.onclick=()=>{ state.filterSet = btn.getAttribute('data-val'); render(); };
  });
  app.querySelectorAll('[data-act="setSubject"]').forEach(btn=>{
    btn.onclick=()=>{ state.filterSubject = btn.getAttribute('data-val'); render(); };
  });
  app.querySelectorAll('[data-act="setCount"]').forEach(btn=>{
    btn.onclick=()=>{
      const v = btn.getAttribute('data-val');
      state.filterCount = v==='all'?'all':Number(v);
      render();
    };
  });
  const startBtn = document.getElementById('startBtn');
  if(startBtn) startBtn.onclick = startSession;

  const reviewBtn = document.getElementById('reviewBtn');
  if(reviewBtn) reviewBtn.onclick = startReviewSession;

  app.querySelectorAll('[data-act="select"]').forEach(btn=>{
    btn.onclick=()=>{
      state.session.selected = Number(btn.getAttribute('data-val'));
      render();
    };
  });
  const submitBtn = document.getElementById('submitBtn');
  if(submitBtn) submitBtn.onclick = submitAnswer;
  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.onclick = nextQuestion;

  const toHomeBtn = document.getElementById('toHomeBtn');
  if(toHomeBtn) toHomeBtn.onclick = ()=>{ state.view='home'; render(); };

  const backHomeBtn = document.getElementById('backHomeBtn');
  if(backHomeBtn) backHomeBtn.onclick = ()=>{
    const ok = window.confirm('演習を中断してトップページに戻りますか？\n（この問題の回答は保存されません）');
    if(ok){ state.view='home'; render(); }
  };
  const toCalBtn = document.getElementById('toCalBtn');
  if(toCalBtn) toCalBtn.onclick = ()=>{ state.view='calendar'; render(); };

  const shareBtn = document.getElementById('shareBtn');
  if(shareBtn) shareBtn.onclick = ()=> shareResult(state.session);

  const calPrev = document.getElementById('calPrev');
  if(calPrev) calPrev.onclick = ()=>{
    state.calMonth--; if(state.calMonth<0){state.calMonth=11; state.calYear--;}
    render();
  };
  const calNext = document.getElementById('calNext');
  if(calNext) calNext.onclick = ()=>{
    state.calMonth++; if(state.calMonth>11){state.calMonth=0; state.calYear++;}
    render();
  };
}

/* ---------- init ---------- */
(async function init(){
  render();
  state.data = await loadAppData();
  state.loading = false;
  render();
})();
</script>
</body>
</html>
